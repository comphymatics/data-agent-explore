<text x="1184" y="1016" font-size="19" font-weight="400" fill="#475569" text-anchor="start">Identity / Semantic / Structural 分离</text>
<text x="1184" y="1040" font-size="19" font-weight="400" fill="#475569" text-anchor="start">同类型 + 稳定键 / 显式 Crosswalk</text>
<text x="1184" y="1064" font-size="19" font-weight="400" fill="#475569" text-anchor="start">不回写 Reference；保留冲突</text>
