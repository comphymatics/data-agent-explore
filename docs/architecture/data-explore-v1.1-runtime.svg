<text x="644" y="1016" font-size="19" font-weight="400" fill="#475569" text-anchor="start">针对缺口批量展开，最多一次</text>
<text x="644" y="1040" font-size="19" font-weight="400" fill="#475569" text-anchor="start">字段 / 粒度 / Join / 业务映射</text>
<text x="644" y="1064" font-size="19" font-weight="400" fill="#475569" text-anchor="start">不够就保留缺口与 stop_reason</text>
